<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>奏折 · 意见反馈后台</title>
  <style>
    :root {
      --text: #1f242e;
      --muted: #737a85;
      --bg: #f4f5f7;
      --card: #ffffff;
      --line: #e5e5eb;
      --blue: #2f6fed;
      --ok: #1a7f4b;
      --bad: #c0392b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 13px; margin: 6px 0 20px; }
    .sub a { color: var(--blue); text-decoration: none; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    input, select, button {
      font: inherit; font-size: 14px; border-radius: 10px;
      border: 1px solid var(--line); background: #fff; color: var(--text);
    }
    #token { flex: 1; min-width: 180px; padding: 8px 12px; }
    select { padding: 8px 12px; }
    button {
      background: var(--blue); color: #fff; border-color: var(--blue);
      padding: 8px 14px; cursor: pointer; font-weight: 600;
    }
    button.ghost { background: #fff; color: var(--text); border-color: var(--line); font-weight: 500; }
    button:disabled { opacity: 0.55; cursor: default; }
    .msg { min-height: 22px; margin-bottom: 12px; font-size: 13px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--bad); }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .card-top {
      display: flex; flex-wrap: wrap; gap: 8px 12px;
      align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e8f0ff;
      color: var(--blue);
      font-weight: 600;
      font-size: 12px;
    }
    .badge.bug { background: #fdecea; color: var(--bad); }
    .badge.parse { background: #fff4e5; color: #b86e00; }
    .badge.other { background: #eef0f4; color: var(--muted); }
    .content {
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    .imgs {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .imgs a {
      display: block; width: 72px; height: 72px; border-radius: 10px;
      overflow: hidden; border: 1px solid var(--line);
    }
    .imgs img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .contact { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .status-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .status-row label { font-size: 12px; color: var(--muted); }
    .status-row select { font-size: 13px; padding: 6px 10px; }
    .reply-block { margin-top: 12px; }
    .reply-block label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .reply-block textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      font: inherit;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      line-height: 1.5;
    }
    .reply-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .reply-actions .hint {
      font-size: 12px;
      color: var(--muted);
    }
    .pager { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>意见反馈后台</h1>
    <p class="sub">
      改进展、写官方回复（公开墙可见）。公开墙：
      <a href="/feedback" target="_blank" rel="noopener">/feedback</a>
      ·
      <a href="/internal/analytics">埋点看板</a>
      ·
      <a href="/internal/app-update">版本更新</a>
    </p>
    <div class="row">
      <input id="token" type="password" placeholder="看板 Token" autocomplete="off" />
      <select id="category">
        <option value="">全部类型</option>
        <option value="feature">功能建议</option>
        <option value="bug">问题反馈</option>
        <option value="parse">解析异常</option>
        <option value="other">其他</option>
      </select>
      <select id="statusFilter">
        <option value="">全部进展</option>
        <option value="pending">待处理</option>
        <option value="in_progress">处理中</option>
        <option value="done">已完成</option>
      </select>
      <button id="load" type="button">刷新</button>
      <button id="prev" type="button" class="ghost">上一页</button>
      <button id="next" type="button" class="ghost">下一页</button>
    </div>
    <div id="msg" class="msg"></div>
    <div id="meta" class="meta"></div>
    <div id="list" class="list"></div>
  </div>
  <script>
    const TOKEN_KEY = 'conflux_analytics_token';
    const PAGE_SIZE = 30;
    const $ = (id) => document.getElementById(id);
    let offset = 0;
    let total = 0;

    function token() { return $('token').value.trim(); }

    function show(text, ok) {
      const el = $('msg');
      el.textContent = text || '';
      el.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
    }

    function fmtTime(v) {
      if (!v) return '';
      try { return new Date(v).toLocaleString(); } catch { return String(v); }
    }

    function badgeClass(cat) {
      if (cat === 'bug' || cat === 'parse' || cat === 'other') return cat;
      return '';
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function who(it) {
      if (it.nickname) return escapeHtml(it.nickname);
      if (it.phone) return `手机 ${escapeHtml(it.phone)}`;
      if (it.userId) return `用户 #${it.userId}`;
      return '游客';
    }

    function render(items) {
      const root = $('list');
      if (!items.length) {
        root.innerHTML = '<div class="empty">暂无反馈</div>';
        return;
      }
      root.innerHTML = items.map((it) => {
        const badge = it.categoryLabel || it.category;
        const ver = it.appVersion ? ` · ${escapeHtml(it.appVersion)}` : '';
        const contact = it.contact
          ? `<div class="contact">联系方式：${escapeHtml(it.contact)}</div>`
          : '';
        const imgs = Array.isArray(it.images) ? it.images : [];
        const imgHtml = imgs.length
          ? `<div class="imgs">${imgs.map((u) =>
              `<a href="${escapeHtml(u)}" target="_blank" rel="noopener"><img src="${escapeHtml(u)}" alt="" /></a>`
            ).join('')}</div>`
          : '';
        const st = it.status || 'pending';
        const reply = it.adminReply || '';
        const repliedHint = it.repliedAt
          ? `上次回复 ${escapeHtml(fmtTime(it.repliedAt))}`
          : '公开墙可见；清空并保存可撤回';
        return `
          <article class="card" data-id="${it.id}">
            <div class="card-top">
              <span class="badge ${badgeClass(it.category)}">${escapeHtml(badge)}</span>
              <span>${who(it)}</span>
              <span>#${it.id}${ver}</span>
              <span>${escapeHtml(fmtTime(it.createdAt))}</span>
            </div>
            <p class="content">${escapeHtml(it.content)}</p>
            ${imgHtml}
            ${contact}
            <div class="status-row">
              <label>进展</label>
              <select class="status-select" data-id="${it.id}">
                <option value="pending"${st === 'pending' ? ' selected' : ''}>待处理</option>
                <option value="in_progress"${st === 'in_progress' ? ' selected' : ''}>处理中</option>
                <option value="done"${st === 'done' ? ' selected' : ''}>已完成</option>
              </select>
            </div>
            <div class="reply-block">
              <label for="reply-${it.id}">官方回复</label>
              <textarea id="reply-${it.id}" class="reply-input" data-id="${it.id}" maxlength="2000" placeholder="写给用户的回复…">${escapeHtml(reply)}</textarea>
              <div class="reply-actions">
                <button type="button" class="reply-save" data-id="${it.id}">保存回复</button>
                <span class="hint">${repliedHint}</span>
              </div>
            </div>
          </article>
        `;
      }).join('');

      root.querySelectorAll('.status-select').forEach((sel) => {
        sel.addEventListener('change', async () => {
          const id = sel.getAttribute('data-id');
          const status = sel.value;
          try {
            const json = await patchFeedback(id, { status });
            show(`#${id} → ${json.statusLabel || status}`, true);
          } catch (e) {
            show(e.message || '更新失败', false);
            load().catch(() => {});
          }
        });
      });

      root.querySelectorAll('.reply-save').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const ta = root.querySelector(`.reply-input[data-id="${id}"]`);
          const adminReply = ta ? ta.value.trim() : '';
          btn.disabled = true;
          try {
            const json = await patchFeedback(id, { adminReply });
            show(
              adminReply
                ? `#${id} 回复已保存`
                : `#${id} 回复已清空`,
              true,
            );
            const hint = btn.parentElement?.querySelector('.hint');
            if (hint) {
              hint.textContent = json.repliedAt
                ? `上次回复 ${fmtTime(json.repliedAt)}`
                : '公开墙可见；清空并保存可撤回';
            }
          } catch (e) {
            show(e.message || '保存失败', false);
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    async function patchFeedback(id, body) {
      const t = token();
      const res = await fetch('/api/feedback/admin/' + id, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'X-Analytics-Token': t,
        },
        body: JSON.stringify(body),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.message || '更新失败');
      return json;
    }

    async function load() {
      const t = token();
      if (!t) {
        show('请填写看板 Token（环境变量 ANALYTICS_DASHBOARD_TOKEN）', false);
        return;
      }
      sessionStorage.setItem(TOKEN_KEY, t);
      show('加载中…', true);
      const qs = new URLSearchParams({
        limit: String(PAGE_SIZE),
        offset: String(offset),
        t: String(Date.now()),
      });
      const cat = $('category').value;
      if (cat) qs.set('category', cat);
      const st = $('statusFilter').value;
      if (st) qs.set('status', st);
      const res = await fetch('/api/feedback/admin?' + qs.toString(), {
        headers: { 'X-Analytics-Token': t },
        cache: 'no-store',
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        show(json.message || '加载失败', false);
        return;
      }
      total = Number(json.total || 0);
      render(json.items || []);
      const from = total === 0 ? 0 : offset + 1;
      const to = Math.min(offset + PAGE_SIZE, total);
      $('meta').textContent = `共 ${total} 条 · 当前 ${from}–${to}`;
      $('prev').disabled = offset <= 0;
      $('next').disabled = offset + PAGE_SIZE >= total;
      show('已刷新', true);
    }

    $('load').onclick = () => {
      offset = 0;
      load().catch((e) => show(e.message || '加载失败', false));
    };
    $('category').onchange = () => {
      offset = 0;
      load().catch((e) => show(e.message || '加载失败', false));
    };
    $('statusFilter').onchange = () => {
      offset = 0;
      load().catch((e) => show(e.message || '加载失败', false));
    };
    $('prev').onclick = () => {
      offset = Math.max(0, offset - PAGE_SIZE);
      load().catch((e) => show(e.message || '加载失败', false));
    };
    $('next').onclick = () => {
      offset += PAGE_SIZE;
      load().catch((e) => show(e.message || '加载失败', false));
    };

    const saved = sessionStorage.getItem(TOKEN_KEY);
    if (saved) {
      $('token').value = saved;
      load().catch(() => {});
    }
  </script>
</body>
</html>
