<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>奏折 · App 版本更新</title>
  <style>
    :root {
      --text: #1f242e;
      --muted: #737a85;
      --bg: #f4f5f7;
      --line: #e5e5eb;
      --blue: #2f6fed;
      --ok: #1a7f4b;
      --bad: #c0392b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 13px; margin: 6px 0 20px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    input, textarea, button {
      font: inherit; font-size: 14px; border-radius: 10px;
      border: 1px solid var(--line); background: #fff; color: var(--text);
    }
    input, textarea { width: 100%; padding: 10px 12px; }
    textarea { min-height: 96px; resize: vertical; }
    #token { flex: 1; min-width: 180px; padding: 8px 12px; width: auto; }
    button {
      background: var(--blue); color: #fff; border-color: var(--blue);
      padding: 8px 14px; cursor: pointer; font-weight: 600;
    }
    button.ghost { background: #fff; color: var(--text); border-color: var(--line); font-weight: 500; }
    button:disabled { opacity: 0.55; cursor: default; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .msg { min-height: 22px; margin-top: 12px; font-size: 13px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--bad); }
    .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>App 版本更新</h1>
    <p class="sub">
      配置商店上的最新版本号。客户端进入主壳后会比对本地版本，更低则弹「可选更新」提示。
      最新版本留空则不提示。与埋点看板共用 Token。
    </p>
    <div class="row">
      <input id="token" type="password" placeholder="看板 Token" autocomplete="off" />
      <button id="load" type="button" class="ghost">读取</button>
      <button id="save" type="button">保存</button>
    </div>

    <div class="field">
      <label for="latestVersion">最新版本号（如 1.3.2）</label>
      <input id="latestVersion" type="text" maxlength="32" placeholder="留空 = 不提示更新" />
    </div>
    <div class="field">
      <label for="releaseNotes">更新说明（弹窗正文，可选）</label>
      <textarea id="releaseNotes" maxlength="2000" placeholder="为空时客户端用默认文案"></textarea>
    </div>
    <div class="field">
      <label for="iosStoreUrl">iOS App Store 链接</label>
      <input id="iosStoreUrl" type="url" maxlength="500" placeholder="https://apps.apple.com/app/id…" />
      <p class="hint">点「立即更新」时打开</p>
    </div>
    <div class="field">
      <label for="androidStoreUrl">Android 商店链接（可选）</label>
      <input id="androidStoreUrl" type="url" maxlength="500" placeholder="https://play.google.com/store/apps/…" />
    </div>

    <div id="meta" class="meta"></div>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    const TOKEN_KEY = 'conflux_analytics_token';
    const $ = (id) => document.getElementById(id);

    function token() { return $('token').value.trim(); }

    function show(text, ok) {
      const el = $('msg');
      el.textContent = text || '';
      el.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
    }

    function fill(cfg) {
      $('latestVersion').value = cfg.latestVersion || '';
      $('releaseNotes').value = cfg.releaseNotes || '';
      $('iosStoreUrl').value = cfg.iosStoreUrl || '';
      $('androidStoreUrl').value = cfg.androidStoreUrl || '';
      $('meta').textContent = cfg.updatedAt
        ? '上次保存：' + new Date(cfg.updatedAt).toLocaleString()
        : '尚未保存过';
    }

    async function load() {
      const t = token();
      if (!t) {
        show('请填写看板 Token（环境变量 ANALYTICS_DASHBOARD_TOKEN）', false);
        return;
      }
      sessionStorage.setItem(TOKEN_KEY, t);
      show('读取中…', true);
      const res = await fetch('/api/app/version/admin?t=' + Date.now(), {
        headers: { 'X-Analytics-Token': t },
        cache: 'no-store',
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        show(json.message || '读取失败', false);
        return;
      }
      fill(json);
      show('已读取', true);
    }

    async function save() {
      const t = token();
      if (!t) {
        show('请填写看板 Token', false);
        return;
      }
      sessionStorage.setItem(TOKEN_KEY, t);
      show('保存中…', true);
      const body = {
        latestVersion: $('latestVersion').value.trim(),
        releaseNotes: $('releaseNotes').value.trim(),
        iosStoreUrl: $('iosStoreUrl').value.trim(),
        androidStoreUrl: $('androidStoreUrl').value.trim(),
      };
      const res = await fetch('/api/app/version/admin', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Analytics-Token': t,
        },
        body: JSON.stringify(body),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        show(json.message || '保存失败', false);
        return;
      }
      fill(json);
      show('已保存', true);
    }

    $('load').onclick = () => load().catch((e) => show(e.message || '读取失败', false));
    $('save').onclick = () => save().catch((e) => show(e.message || '保存失败', false));

    const saved = sessionStorage.getItem(TOKEN_KEY);
    if (saved) {
      $('token').value = saved;
      load().catch(() => {});
    }
  </script>
</body>
</html>
