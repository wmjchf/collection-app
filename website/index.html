<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Conflux</title>
  <meta name="description" content="把好内容收到一处，想看的时候翻得出来。" />
  <meta name="theme-color" content="#2F6FED" />
  <link rel="icon" href="assets/apple-touch-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <a class="nav-brand" href="#top">
      <img class="app-icon" src="assets/icon.png" width="28" height="28" alt="" />
      Conflux
    </a>
    <nav>
      <a href="#capture">功能</a>
      <a href="https://inkmind.xyz/collection/privacy">隐私</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <img class="app-icon hero-icon" src="assets/icon.png" width="128" height="128" alt="Conflux" />
      <h1>Conflux</h1>
      <p>把好内容收到一处，想看的时候翻得出来。</p>
      <div class="cta">
        <a class="btn btn-primary" href="#">获取 App</a>
        <a class="btn btn-ghost" href="#">Chrome 扩展</a>
      </div>
    </section>

    <section class="block" id="capture">
      <div class="inner">
        <div class="copy">
          <h2>一键收</h2>
          <p>刷到好内容，分享一下就进来。不用复制、粘贴、再确认。</p>
        </div>
        <figure class="phone">
          <span class="phone-btn silent" aria-hidden="true"></span>
          <span class="phone-btn vol-up" aria-hidden="true"></span>
          <span class="phone-btn vol-down" aria-hidden="true"></span>
          <span class="phone-btn power" aria-hidden="true"></span>
          <div class="phone-screen">
            <img src="assets/capture.png" width="470" height="1024" alt="三种入库方式：系统分享、复制链接、快捷指令" />
          </div>
        </figure>
      </div>
    </section>

    <section class="block wash">
      <div class="inner flip">
        <div class="copy">
          <h2>稍后看</h2>
          <p>未读、标注、最近阅读。回来就能接着看。</p>
        </div>
        <figure class="phone">
          <span class="phone-btn silent" aria-hidden="true"></span>
          <span class="phone-btn vol-up" aria-hidden="true"></span>
          <span class="phone-btn vol-down" aria-hidden="true"></span>
          <span class="phone-btn power" aria-hidden="true"></span>
          <div class="phone-screen">
            <img src="assets/home.png" width="470" height="1024" alt="首页：未读、标注与最近阅读" />
          </div>
        </figure>
      </div>
    </section>

    <section class="block">
      <div class="inner">
        <div class="copy">
          <h2>容易读</h2>
          <p>不是一串裸链。标题、封面、正文都在，打开就能看。</p>
        </div>
        <figure class="phone">
          <span class="phone-btn silent" aria-hidden="true"></span>
          <span class="phone-btn vol-up" aria-hidden="true"></span>
          <span class="phone-btn vol-down" aria-hidden="true"></span>
          <span class="phone-btn power" aria-hidden="true"></span>
          <div class="phone-screen">
            <img src="assets/reading.png" width="470" height="1024" alt="阅读页：标题、封面与正文" />
          </div>
        </figure>
      </div>
    </section>

    <section class="block wash">
      <div class="inner flip">
        <div class="copy">
          <h2>理得清</h2>
          <p>收藏夹、标签、系统分类。以后找得到。</p>
        </div>
        <figure class="phone">
          <span class="phone-btn silent" aria-hidden="true"></span>
          <span class="phone-btn vol-up" aria-hidden="true"></span>
          <span class="phone-btn vol-down" aria-hidden="true"></span>
          <span class="phone-btn power" aria-hidden="true"></span>
          <div class="phone-screen">
            <img src="assets/library.png" width="470" height="1024" alt="我的收藏：系统分类、收藏夹与标签" />
          </div>
        </figure>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-brand">
      <img class="app-icon" src="assets/icon.png" width="22" height="22" alt="" />
      Conflux
    </span>
    <a href="https://inkmind.xyz/collection/privacy">隐私政策</a>
    <a href="https://inkmind.xyz/collection/support">用户支持</a>
  </footer>
</body>
</html>
