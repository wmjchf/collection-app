<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conflux</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <section id="login" hidden>
    <div class="login-wrap">
      <h1>Conflux</h1>
      <p class="sub">手机号验证码登录</p>

      <label for="phone">手机号</label>
      <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="tel" />

      <label for="code">验证码</label>
      <div class="code-row">
        <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="请输入验证码" />
        <button type="button" id="send" class="soft">获取验证码</button>
      </div>

      <label class="agree">
        <input id="agreed" type="checkbox" />
        <span>
          我已阅读并同意
          <a href="https://conflux.wobufang.com/support#user-agreement" target="_blank" rel="noopener">《用户协议》</a>
          与
          <a href="https://conflux.wobufang.com/privacy" target="_blank" rel="noopener">《隐私政策》</a>
        </span>
      </label>

      <button type="button" id="login-btn" class="primary">登录</button>
    </div>
  </section>

  <div id="app" hidden>
    <section id="home" hidden>
      <header class="topbar">
        <h1>首页</h1>
        <div class="top-actions">
          <button type="button" id="search-btn" class="icon-btn" title="搜索" aria-label="搜索">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
              <path d="M19.25 19.25L15.3083 15.3083M10.0833 16.5C13.6277 16.5 16.5 13.6277 16.5 10.0833C16.5 6.53896 13.6277 3.66667 10.0833 3.66667C6.53896 3.66667 3.66667 6.53896 3.66667 10.0833C3.66667 13.6277 6.53896 16.5 10.0833 16.5Z" stroke="#1F2430" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" id="save-btn" class="icon-btn" title="添加链接" aria-label="添加链接">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
              <path d="M11 4.58333V17.4167M4.58333 11H17.4167" stroke="#1F2430" stroke-width="1.65" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </header>
      <div id="home-body" class="home-body"></div>
    </section>

    <section id="collection" hidden>
      <header class="topbar topbar-collection">
        <h1>我的收藏</h1>
        <div class="top-actions">
          <button type="button" id="settings-btn" class="icon-btn" title="设置" aria-label="设置">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z" stroke="#1F242E" stroke-width="1.7"/>
              <path d="M19.4 13a7.8 7.8 0 0 0 .05-2l2.02-1.57-2-3.46-2.4.56a8 8 0 0 0-1.73-1L15 3h-6l-.34 2.53a8 8 0 0 0-1.73 1l-2.4-.56-2 3.46L4.55 11a7.8 7.8 0 0 0 0 2l-2.02 1.57 2 3.46 2.4-.56a8 8 0 0 0 1.73 1L9 21h6l.34-2.53a8 8 0 0 0 1.73-1l2.4.56 2-3.46L19.4 13Z" stroke="#1F242E" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>
      <div id="collection-body" class="collection-body"></div>
    </section>

    <section id="more" hidden>
      <header class="topbar topbar-sub">
        <button type="button" id="more-back" class="back-btn" aria-label="返回">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          返回
        </button>
        <h1 id="more-title" class="topbar-title">列表</h1>
        <button type="button" id="more-action" class="text-action" hidden>清空</button>
        <span id="more-spacer" class="top-spacer"></span>
      </header>
      <div id="more-list" class="list"></div>
      <p id="more-status" class="list-msg" hidden></p>
    </section>

    <section id="search" hidden>
      <header class="search-bar">
        <button type="button" id="search-back" class="back-btn" aria-label="返回">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          返回
        </button>
        <input id="search-input" type="search" placeholder="搜索收藏" />
      </header>
      <div id="search-list" class="list"></div>
      <p id="search-status" class="list-msg" hidden></p>
    </section>

    <section id="settings" hidden>
      <header class="topbar topbar-sub">
        <button type="button" id="settings-back" class="back-btn" aria-label="返回">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          返回
        </button>
        <h1 class="topbar-title">设置</h1>
        <span class="top-spacer"></span>
      </header>
      <div id="settings-body" class="settings-body"></div>
    </section>

    <section id="detail" hidden>
      <header class="topbar topbar-detail">
        <button type="button" id="detail-back" class="back-btn" aria-label="返回">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          返回
        </button>
        <div class="more-wrap">
          <button type="button" id="detail-more" class="icon-btn more-dots" title="更多" aria-label="更多" disabled>⋯</button>
          <div id="detail-menu" class="overflow-menu" hidden>
            <button type="button" id="detail-copy">复制链接</button>
            <button type="button" id="detail-tags">标签</button>
            <button type="button" id="detail-delete" class="danger">删除</button>
          </div>
        </div>
      </header>
      <div id="detail-body" class="detail-body"></div>
    </section>

    <nav id="tabbar" class="tabbar" hidden>
      <button type="button" class="tab-item is-active" data-tab="home">
        <svg class="tab-icon-on" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M3.66667 9.625L11 3.66667L18.3333 9.625V18.3333C18.3333 18.5764 18.2368 18.8096 18.0648 18.9815C17.8929 19.1534 17.6598 19.25 17.4167 19.25H12.65V13.5667H9.35V19.25H4.58333C4.34022 19.25 4.10706 19.1534 3.93515 18.9815C3.76324 18.8096 3.66667 18.5764 3.66667 18.3333V9.625Z" fill="#2F6FED"/>
        </svg>
        <svg class="tab-icon-off" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M4.125 9.9L11 4.125L17.875 9.9V17.875C17.875 18.0938 17.7881 18.3036 17.6334 18.4584C17.4786 18.6131 17.2688 18.7 17.05 18.7H12.65V13.75H9.35V18.7H4.95C4.84166 18.7 4.73438 18.6787 4.63429 18.6372C4.53419 18.5957 4.44325 18.535 4.36664 18.4584C4.29003 18.3818 4.22926 18.2908 4.1878 18.1907C4.14634 18.0906 4.125 17.9833 4.125 17.875V9.9Z" stroke="#737A85" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span>首页</span>
      </button>
      <button type="button" class="tab-item" data-tab="collection">
        <svg class="tab-icon-on" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M3.66667 5.68333C3.66667 5.14848 3.87914 4.63553 4.25733 4.25733C4.63553 3.87914 5.14848 3.66667 5.68333 3.66667H9.44167L10.725 5.13333H16.3167C16.8515 5.13333 17.3645 5.3458 17.7427 5.724C18.1209 6.1022 18.3333 6.61515 18.3333 7.15V16.3167C18.3333 16.8515 18.1209 17.3645 17.7427 17.7427C17.3645 18.1209 16.8515 18.3333 16.3167 18.3333H5.68333C5.14848 18.3333 4.63553 18.1209 4.25733 17.7427C3.87914 17.3645 3.66667 16.8515 3.66667 16.3167V5.68333Z" fill="#2F6FED"/>
        </svg>
        <svg class="tab-icon-off" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M4.125 6.6C4.125 6.1867 4.28918 5.79034 4.58143 5.49809C4.87367 5.20585 5.27004 5.04167 5.68333 5.04167H9.075L10.2667 6.41667H16.3167C16.73 6.41667 17.1263 6.58085 17.4186 6.87309C17.7108 7.16534 17.875 7.5617 17.875 7.975V16.3167C17.875 16.73 17.7108 17.1263 17.4186 17.4186C17.1263 17.7108 16.73 17.875 16.3167 17.875H5.68333C5.27004 17.875 4.87367 17.7108 4.58143 17.4186C4.28918 17.1263 4.125 16.73 4.125 16.3167V6.6Z" stroke="#737A85" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span>我的收藏</span>
      </button>
    </nav>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div id="sheet-add" class="sheet" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2>添加链接</h2>
        <button type="button" class="sheet-cancel" data-close-overlay>取消</button>
      </div>
      <label for="add-url">链接</label>
      <input id="add-url" type="url" readonly />
      <p id="add-error" class="field-error" hidden></p>
      <button type="button" id="add-save" class="primary">保存</button>
      <p id="add-hint" class="sheet-hint" hidden>正在获取标题并保存</p>
    </div>

    <div id="sheet-name" class="sheet" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="name-title">新建</h2>
        <button type="button" class="sheet-cancel" data-close-overlay>取消</button>
      </div>
      <label id="name-label" for="name-input">名称</label>
      <input id="name-input" type="text" maxlength="64" placeholder="请输入名称" />
      <p id="name-error" class="field-error" hidden></p>
      <button type="button" id="name-save" class="primary">创建</button>
    </div>

    <div id="sheet-pick" class="sheet" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="pick-title">选择</h2>
        <button type="button" class="sheet-cancel" data-close-overlay>取消</button>
      </div>
      <div id="pick-list" class="pick-list"></div>
      <button type="button" id="pick-save" class="primary" hidden>保存</button>
    </div>

    <div id="dialog" class="dialog" hidden>
      <h3 id="dialog-title">确认</h3>
      <p id="dialog-msg"></p>
      <div class="dialog-actions">
        <button type="button" id="dialog-cancel">取消</button>
        <button type="button" id="dialog-ok">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
